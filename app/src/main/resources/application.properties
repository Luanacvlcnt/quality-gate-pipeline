spring.application.name=tasks-api

# Ao rodar de dentro de app/, lê as variáveis do .env da raiz (opcional: no container ele não existe)
spring.config.import=optional:file:../.env[.properties]

# Banco: DB_HOST é "localhost" na sua máquina e "postgres" dentro do docker-compose
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Cria/atualiza a tabela a partir da entidade. Suficiente por enquanto;
# numa fase futura, trocar por migrations versionadas (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Expõe só o health check, em /health (usado pelo smoke test e pelo k6)
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health

# Front-end (static/index.html): o jar é gerado com datas fixas (1980), então o Last-Modified
# nunca muda e o navegador continuaria usando a versão antiga em cache após um rebuild.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true
