<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadro de tarefas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000; --col: #121212; --card: #1c1c1c; --text: #f5f5f5; --muted: #a3a3a3;
      --accent: #ff4fa3; --on-accent: #000; --danger: #ff6b6b; --border: #2c2c2c;
      --drop: #3a1028;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
           font: 15px/1.4 system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 16px; color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input:focus { border-color: var(--accent); outline: none; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    input { flex: 1 1 200px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--card); color: var(--text); font: inherit; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent);
             color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    #error { color: var(--danger); min-height: 1.4em; margin: -8px 0 8px; }
    .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;
             align-items: start; }
    .column { background: var(--col); border-radius: 10px; padding: 12px; min-height: 120px;
              border-top: 3px solid var(--accent); }
    .column.over { background: var(--drop); outline: 2px dashed var(--accent); }
    .column h2 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; }
    .column h2 span { color: var(--accent); font-weight: normal; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; margin-bottom: 8px; cursor: grab; }
    .card:hover { border-color: var(--accent); }
    .card.dragging { opacity: .5; }
    .card .title { font-weight: 600; overflow-wrap: anywhere; }
    .card .desc { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
    .card[data-done="true"] .title { text-decoration: line-through; color: var(--muted); }
    .actions { display: flex; gap: 6px; margin-top: 8px; }
    .actions button { padding: 4px 8px; font-size: 12px; background: transparent; color: var(--accent);
                      border: 1px solid var(--border); }
    .actions .delete { color: var(--danger); margin-left: auto; }
  </style>
</head>
<body>
  <h1>Quadro de tarefas</h1>

  <form id="new-task">
    <input id="title" placeholder="Título da tarefa" maxlength="120" required>
    <input id="description" placeholder="Descrição (opcional)" maxlength="1000">
    <button type="submit">Adicionar</button>
  </form>
  <p id="error" role="alert"></p>

  <main class="board">
    <section class="column" data-done="false"><h2>A fazer <span></span></h2><div class="cards"></div></section>
    <section class="column" data-done="true"><h2>Feito <span></span></h2><div class="cards"></div></section>
  </main>

  <script>
    const errorBox = document.getElementById('error');
    let tasks = [];

    // Chama a API e mostra o erro na tela se algo der errado.
    async function api(method, path, body) {
      errorBox.textContent = '';
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error(`${method} ${path} falhou (${res.status})`);
      return res.status === 204 ? null : res.json();
    }

    async function run(action) {
      try { await action(); await load(); } catch (e) { errorBox.textContent = e.message; }
    }

    async function load() {
      tasks = await api('GET', '/tasks');
      render();
    }

    function render() {
      for (const column of document.querySelectorAll('.column')) {
        const done = column.dataset.done === 'true';
        const list = tasks.filter(t => t.done === done);
        column.querySelector('h2 span').textContent = list.length;
        column.querySelector('.cards').replaceChildren(...list.map(cardElement));
      }
    }

    // textContent (e não innerHTML) evita que o texto da tarefa seja interpretado como HTML.
    function cardElement(task) {
      const card = document.createElement('article');
      card.className = 'card';
      card.draggable = true;
      card.dataset.id = task.id;
      card.dataset.done = task.done;

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = task.title;
      card.append(title);

      if (task.description) {
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = task.description;
        card.append(desc);
      }

      // Botões também movem o cartão: arrastar não funciona em telas de toque.
      const actions = document.createElement('div');
      actions.className = 'actions';
      const move = document.createElement('button');
      move.textContent = task.done ? '↺ Reabrir' : '✓ Concluir';
      move.onclick = () => run(() => setDone(task, !task.done));
      const del = document.createElement('button');
      del.className = 'delete';
      del.textContent = 'Excluir';
      del.onclick = () => confirm(`Excluir "${task.title}"?`) && run(() => api('DELETE', `/tasks/${task.id}`));
      actions.append(move, del);
      card.append(actions);

      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', task.id);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      return card;
    }

    // O PUT substitui a tarefa inteira, então reenviamos título e descrição junto.
    function setDone(task, done) {
      return api('PUT', `/tasks/${task.id}`, { title: task.title, description: task.description, done });
    }

    for (const column of document.querySelectorAll('.column')) {
      column.addEventListener('dragover', e => { e.preventDefault(); column.classList.add('over'); });
      column.addEventListener('dragleave', () => column.classList.remove('over'));
      column.addEventListener('drop', e => {
        e.preventDefault();
        column.classList.remove('over');
        const task = tasks.find(t => String(t.id) === e.dataTransfer.getData('text/plain'));
        const done = column.dataset.done === 'true';
        if (task && task.done !== done) run(() => setDone(task, done));
      });
    }

    document.getElementById('new-task').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('title');
      const description = document.getElementById('description');
      run(async () => {
        await api('POST', '/tasks', { title: title.value, description: description.value || null });
        e.target.reset();
        title.focus();
      });
    });

    run(async () => {});
  </script>
</body>
</html>
