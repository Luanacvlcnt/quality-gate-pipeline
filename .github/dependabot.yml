version: 2
updates:
  # Mantém as actions do pipeline atualizadas
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Imagens usadas no docker-compose
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Imagens base do Dockerfile da API
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Dependências Java (pom.xml)
  - package-ecosystem: "maven"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
